packages:
  - 'packages/*'

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.20'
  - '@expo/env@2.4.3'
  - '@expo/fingerprint@0.20.11'
  - '@expo/metro-config@57.0.12'
  - expo-constants@57.0.16
  - expo-font@57.0.2
  - expo@57.0.18

# esbuild (via tsx) needs its install script to run. pnpm 11 renamed this
# setting: `onlyBuiltDependencies` (a list) was the pnpm 10 spelling and is now
# silently ignored, so a clean install fails with ERR_PNPM_IGNORED_BUILDS even
# though the old key looked right. It never showed up on this laptop because
# the build had already run; CI, installing from scratch, failed immediately.
# `pnpm approve-builds` writes this form.
allowBuilds:
  esbuild: true
